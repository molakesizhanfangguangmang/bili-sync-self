name: Self Build

# 这个仓不是上游的 fork，是个十几 KB 的「编译脚手架」：
# 每次跑的时候把上游 pin 住的提交拉到 runner 上，打好 bili-sync-self.patch，
# 再编出 aarch64 / x86_64（都是 musl 静态，无动态依赖）的 bili-sync-rs。
#
# 为什么不直接把上游整段历史搬进这个仓：GitHub 的服务器侧导入接口已经下线
# （PUT /repos/{owner}/{repo}/import 返回 404），只剩本地全量 clone 推一条路，
# 而这条链路在本机实测会超时。上游在 runner 上是秒拉的，何必过本机。
#
# 上游更新时：改 UPSTREAM_PIN，看 patch 能不能照打（打不上就是前端那几行挪了位置，
# 重新对一下再更新 bili-sync-self.patch）。

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  UPSTREAM: https://github.com/amtoaer/bili-sync.git
  UPSTREAM_PIN: c900777e78796653fdfb00421879b6a802d1eedd

jobs:
  build:
    name: Build bili-sync-rs (${{ matrix.slug }}-musl)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: aarch64
            target: aarch64-unknown-linux-musl
          - slug: x86_64
            target: x86_64-unknown-linux-musl
    steps:
      - name: Checkout 脚手架
        uses: actions/checkout@v6

      - name: 拉上游、打补丁、铺进工作区
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$UPSTREAM" /tmp/upstream
          cd /tmp/upstream
          git checkout -q "$UPSTREAM_PIN"
          git apply -v "$GITHUB_WORKSPACE/bili-sync-self.patch"
          # .git 不要；.github 不要（里面是本仓自己的 workflow，别被上游的盖掉）
          tar -c --exclude=.git --exclude=.github . | tar -x -C "$GITHUB_WORKSPACE"
          echo "补丁后的侧栏："
          grep -n "存储\|HardDrive" "$GITHUB_WORKSPACE/web/src/lib/components/app-sidebar.svelte"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 编前端
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: 读工具链版本
        id: read_rust_toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "value=$channel" >> $GITHUB_OUTPUT

      - name: 编二进制
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          toolchain: ${{ steps.read_rust_toolchain.outputs.value }}
          args: "--locked --release"
          strip: true

      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/bili-sync-rs-Linux-${{ matrix.slug }}-musl.tar.gz" bili-sync-rs
          sha256sum bili-sync-rs | tee "$GITHUB_WORKSPACE/bili-sync-rs-${{ matrix.slug }}.sha256"
          ls -l "$GITHUB_WORKSPACE/bili-sync-rs-Linux-${{ matrix.slug }}-musl.tar.gz"

      - name: 传产物
        uses: actions/upload-artifact@v6
        with:
          name: bili-sync-rs-Linux-${{ matrix.slug }}
          path: |
            bili-sync-rs-Linux-${{ matrix.slug }}-musl.tar.gz
            bili-sync-rs-${{ matrix.slug }}.sha256

      - name: 顺带留一份前端产物（便于离线核对菜单项与路由）
        if: matrix.slug == 'aarch64'
        uses: actions/upload-artifact@v6
        with:
          name: web-build
          path: web/build
